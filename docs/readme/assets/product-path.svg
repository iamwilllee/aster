<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>ASTER / FROM IDEA TO PRODUCT</title><rect width="1600" height="900" fill="#f6f5ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" fill="#223d30"><text x="80" y="92" font-size="24" letter-spacing="4">ASTER / FROM IDEA TO PRODUCT</text><text x="80" y="157" font-size="44" font-weight="600">从一个需求开始，按需组合成自己的产品。</text><rect x="80" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="104" y="280" font-size="30" fill="#236b4b">01 明确需求</text><text x="104" y="330" font-size="24" fill="#526757">页面、数据与使用者</text><path d="M412 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="450" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="474" y="280" font-size="30" fill="#236b4b">02 选择能力</text><text x="474" y="330" font-size="24" fill="#526757">保留需要的模块</text><path d="M782 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="820" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="844" y="280" font-size="30" fill="#236b4b">03 独立开发</text><text x="844" y="330" font-size="24" fill="#526757">自己的品牌与业务</text><path d="M1152 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="1190" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="1214" y="280" font-size="30" fill="#236b4b">04 实测交付</text><text x="1214" y="330" font-size="24" fill="#526757">逐个产品记录证据</text><rect x="80" y="450" width="690" height="245" rx="14" fill="#fffefa" stroke="#d9dfd1"/><text x="110" y="507" font-size="32" fill="#236b4b">SHOWCASE · 公开展示</text><text x="110" y="568" font-size="28" fill="#526757">双语页面、主题与 SEO</text><text x="110" y="615" font-size="28" fill="#526757">无需数据库、账号、邮件或支付</text><rect x="830" y="450" width="690" height="245" rx="14" fill="#fffefa" stroke="#d9dfd1"/><text x="860" y="507" font-size="32" fill="#236b4b">WEB-APP · 普通应用</text><text x="860" y="568" font-size="28" fill="#526757">D1、邮箱账号与私有项目示例</text><text x="860" y="615" font-size="28" fill="#526757">Google、图片、内容等能力按需选择</text><text x="80" y="788" font-size="27" fill="#526757">支付默认关闭  ·  AI 与用量账本尚未接入</text><text x="80" y="839" font-size="21" fill="#526757">能力结构示意，依据 v0.2.0-beta.1 源码；不是产品界面截图。</text> </g></svg>