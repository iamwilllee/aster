<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>ASTER / FROM IDEA TO PRODUCT</title><rect width="1600" height="900" fill="#f6f5ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" fill="#223d30"><text x="80" y="92" font-size="24" letter-spacing="4">ASTER / FROM IDEA TO PRODUCT</text><text x="80" y="157" font-size="44" font-weight="600">Start from one need. Compose your own product.</text><rect x="80" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="104" y="280" font-size="30" fill="#236b4b">01 Define the need</text><text x="104" y="330" font-size="24" fill="#526757">Pages, data and users</text><path d="M412 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="450" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="474" y="280" font-size="30" fill="#236b4b">02 Pick modules</text><text x="474" y="330" font-size="24" fill="#526757">Keep only what you need</text><path d="M782 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="820" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="844" y="280" font-size="30" fill="#236b4b">03 Build on your own</text><text x="844" y="330" font-size="24" fill="#526757">Your brand and business</text><path d="M1152 297h22m-8-8 8 8-8 8" stroke="#76906d" stroke-width="3" fill="none"/><rect x="1190" y="220" width="320" height="155" rx="14" fill="#e5ecdf"/><text x="1214" y="280" font-size="30" fill="#236b4b">04 Test and ship</text><text x="1214" y="330" font-size="24" fill="#526757">Evidence recorded per product</text><rect x="80" y="450" width="690" height="245" rx="14" fill="#fffefa" stroke="#d9dfd1"/><text x="110" y="507" font-size="32" fill="#236b4b">SHOWCASE · public site</text><text x="110" y="568" font-size="28" fill="#526757">Bilingual pages, themes, SEO</text><text x="110" y="615" font-size="28" fill="#526757">No database, accounts, mail or billing</text><rect x="830" y="450" width="690" height="245" rx="14" fill="#fffefa" stroke="#d9dfd1"/><text x="860" y="507" font-size="32" fill="#236b4b">WEB-APP · data app</text><text x="860" y="568" font-size="28" fill="#526757">D1, email accounts, private projects</text><text x="860" y="615" font-size="28" fill="#526757">Google, images, content are opt-in</text><text x="80" y="788" font-size="27" fill="#526757">Payments off by default  ·  AI and usage ledger not connected</text><text x="80" y="839" font-size="21" fill="#526757">Capability diagram based on v0.2.0-beta.1 source; not a product screenshot.</text> </g></svg>