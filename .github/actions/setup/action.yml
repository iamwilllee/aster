name: Set up Aster
description: Install pnpm, Node and the locked dependencies, generate the local configuration, and optionally prepare Chromium.
inputs:
  browser:
    description: Install Chromium for Playwright (cached by Playwright version).
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 12.11.2
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm setup
      shell: bash
    - name: Read the Playwright version
      if: inputs.browser == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Restore Chromium
      if: inputs.browser == 'true'
      id: chromium
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    # The browser download is cached; the operating-system libraries are not, so they are
    # installed on every run.
    - name: Install Chromium
      if: inputs.browser == 'true' && steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Install Chromium system libraries
      if: inputs.browser == 'true' && steps.chromium.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
